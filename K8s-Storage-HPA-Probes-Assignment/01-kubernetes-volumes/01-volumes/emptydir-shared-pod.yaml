# Two containers in one Pod sharing the same emptyDir volume.
# "writer" appends a timestamp every 5s, nginx serves the same files.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-shared
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date) written by writer container\" >> /shared/index.html; sleep 5; done"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
