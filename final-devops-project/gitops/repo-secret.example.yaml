# Template only - the real private key never goes into Git.
#   ssh-keygen -t ed25519 -N "" -f final-project-argocd          (outside the repo)
#   gh repo deploy-key add final-project-argocd.pub --repo paradoxicsys/uni-devops --title final-project-argocd
apiVersion: v1
kind: Secret
metadata:
  name: uni-devops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:paradoxicsys/uni-devops.git
  sshPrivateKey: |
    <contents of final-project-argocd (read-only deploy key)>
