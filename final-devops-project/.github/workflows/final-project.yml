name: Final Project - CI/CD + DevSecOps

# Code -> Build & Test -> SAST / SCA / Secret scan / IaC lint -> Docker build -> Image scan
#      -> Security gate -> Push to GHCR -> Deploy to Kubernetes (kind + Helm) -> Smoke test
on:
  push:
    branches: [main]
    paths:
      - "final-devops-project/**"
      - "!final-devops-project/**/*.md"
      - "!final-devops-project/screenshots/**"
      - ".github/workflows/final-project.yml"
  pull_request:
    branches: [main]
    paths:
      - "final-devops-project/**"
      - "!final-devops-project/**/*.md"
      - "!final-devops-project/screenshots/**"
      - ".github/workflows/final-project.yml"
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image for the Docker build (an old one such as node:16 makes the security gate fail)"
        default: "node:22-alpine"
        required: true

permissions:
  contents: read

concurrency:
  group: final-project-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: final-devops-project
  APP_DIR: final-devops-project/application
  CHART_DIR: final-devops-project/helm/final-app
  IMAGE_NAME: final-devops-app
  REGISTRY_IMAGE: ghcr.io/paradoxicsys/final-devops-app
  BASE_IMAGE: ${{ github.event.inputs.base_image || 'node:22-alpine' }}
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.75.0

jobs:
  # ---------------- 1. Build & unit tests ----------------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (syntax check)
        run: npm run build
      - name: Unit tests (JUnit report)
        run: |
          mkdir -p reports
          npm run test:report
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: ${{ env.APP_DIR }}/reports/

  # ---------------- 2. Helm / Terraform / manifest checks ----------------
  iac-lint:
    name: IaC Lint (Helm + Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: helm lint (default + prod values)
        run: |
          helm lint $CHART_DIR
          helm lint $CHART_DIR -f $CHART_DIR/values-prod.yaml
          helm template final-app $CHART_DIR -f $CHART_DIR/values-prod.yaml > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: ${{ env.PROJECT_DIR }}/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # ---------------- 3. SAST (Semgrep) ----------------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - name: Install Semgrep
        run: pip install --quiet semgrep && semgrep --version
      - name: Run Semgrep (custom rules + community rulesets)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          semgrep scan --metrics=off --error \
            --config security/.semgrep.yml \
            --config p/javascript --config p/nodejs --config p/secrets \
            --exclude node_modules \
            --json-output=semgrep.json \
            application
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-semgrep
          path: ${{ env.PROJECT_DIR }}/semgrep.json

  # ---------------- 4. SCA (npm audit + Trivy fs) ----------------
  sca:
    name: SCA - npm audit + Trivy fs
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (fail on high/critical)
        working-directory: ${{ env.APP_DIR }}
        run: npm audit --audit-level=high
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
          trivy --version
      - name: Trivy filesystem scan of dependencies
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile $PROJECT_DIR/security/.trivyignore $APP_DIR

  # ---------------- 5. Secret scanning (Gitleaks CLI) ----------------
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
          gitleaks version
      - name: Scan project files
        run: gitleaks dir $PROJECT_DIR --config $PROJECT_DIR/security/.gitleaks.toml --redact --verbose
      - name: Scan git history of the project
        run: gitleaks git . --config $PROJECT_DIR/security/.gitleaks.toml --redact --verbose --log-opts="-- $PROJECT_DIR"

  # ---------------- 6. Docker build ----------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    steps:
      - uses: actions/checkout@v7
      - name: Build image (multi-stage, non-root)
        run: |
          echo "Base image: $BASE_IMAGE"
          docker build -f $PROJECT_DIR/docker/Dockerfile \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t $IMAGE_NAME:${GITHUB_SHA::7} $APP_DIR
          docker images $IMAGE_NAME
      - name: Save image
        run: docker save $IMAGE_NAME:${GITHUB_SHA::7} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 3

  # ---------------- 7. Container image scan (Trivy) ----------------
  image-scan:
    name: Image Scan - Trivy
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load image
        run: gunzip -c image.tar.gz | docker load
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
      - name: Full report (all severities, informational)
        run: |
          trivy image --scanners vuln --ignorefile $PROJECT_DIR/security/.trivyignore \
            --format json --output trivy-image.json $IMAGE_NAME:${GITHUB_SHA::7}
          trivy convert --format table --table-mode summary trivy-image.json | head -12 || true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image.json
      - name: Gate - fail on fixable CRITICAL/HIGH vulnerabilities
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --ignorefile $PROJECT_DIR/security/.trivyignore --table-mode detailed \
            $IMAGE_NAME:${GITHUB_SHA::7}
          echo "No fixable CRITICAL/HIGH vulnerabilities - image scan passed"

  # ---------------- 8. Security gate ----------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [build-test, iac-lint, sast, sca, secret-scan, image-scan]
    if: always()
    steps:
      - name: Evaluate all checks
        run: |
          {
            echo "## Security Gate"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Build & unit tests | ${{ needs.build-test.result }} |"
            echo "| IaC lint (Helm + Terraform) | ${{ needs.iac-lint.result }} |"
            echo "| SAST (Semgrep) | ${{ needs.sast.result }} |"
            echo "| SCA (npm audit + Trivy fs) | ${{ needs.sca.result }} |"
            echo "| Secret scan (Gitleaks) | ${{ needs.secret-scan.result }} |"
            echo "| Image scan (Trivy) | ${{ needs.image-scan.result }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for r in ${{ needs.build-test.result }} ${{ needs.iac-lint.result }} ${{ needs.sast.result }} \
                   ${{ needs.sca.result }} ${{ needs.secret-scan.result }} ${{ needs.image-scan.result }}; do
            if [ "$r" != "success" ]; then
              echo "SECURITY GATE: FAILED - image will NOT be pushed or deployed"
              exit 1
            fi
          done
          echo "SECURITY GATE: PASSED - image approved for push and deploy"

  # ---------------- 9. Push image to GHCR ----------------
  push-image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load image
        run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push (commit SHA + latest)
        run: |
          TAG=${GITHUB_SHA::7}
          docker tag $IMAGE_NAME:$TAG $REGISTRY_IMAGE:$TAG
          docker tag $IMAGE_NAME:$TAG $REGISTRY_IMAGE:latest
          docker push $REGISTRY_IMAGE:$TAG
          docker push $REGISTRY_IMAGE:latest
          echo "Pushed $REGISTRY_IMAGE:$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------- 10. Deploy to Kubernetes (kind + Helm) ----------------
  deploy:
    name: Deploy to Kubernetes (Helm)
    runs-on: ubuntu-latest
    needs: push-image
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: final-project
      - uses: azure/setup-helm@v4
      - name: Namespace + GHCR pull secret
        run: |
          kubectl create namespace final-app
          kubectl -n final-app create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
      - name: helm upgrade --install
        run: |
          helm upgrade --install final-app $CHART_DIR -n final-app \
            --set image.tag=${GITHUB_SHA::7} \
            --set imagePullSecrets[0].name=ghcr-pull \
            --set ingress.enabled=false \
            --wait --timeout 3m
          helm list -n final-app
      - name: Rollout status
        run: kubectl -n final-app rollout status deployment/final-app --timeout=120s
      - name: helm test
        run: helm test final-app -n final-app --logs
      - name: Smoke test
        run: |
          kubectl -n final-app get deploy,pods,svc,pvc,hpa -o wide
          kubectl -n final-app port-forward service/final-app 8080:80 >/dev/null 2>&1 &
          sleep 3
          set -x
          curl -sf http://localhost:8080/ ; echo
          curl -sf http://localhost:8080/health ; echo
          curl -sf http://localhost:8080/ready ; echo
          curl -sf -X POST -H 'content-type: application/json' -H 'x-api-token: dummy-token-change-me' \
            -d '{"title":"deployed by the pipeline"}' http://localhost:8080/api/tasks ; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"title":"x"}' http://localhost:8080/api/tasks)" = 401
          curl -sf http://localhost:8080/metrics | grep -E '^(http_requests_total|app_tasks)'
          curl -sf http://localhost:8080/ | grep -q "${GITHUB_SHA::7}" && echo "SMOKE TEST PASSED: version ${GITHUB_SHA::7} is live"
