apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: final-app
  namespace: final-app
  labels: {app: final-app}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: final-app}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
