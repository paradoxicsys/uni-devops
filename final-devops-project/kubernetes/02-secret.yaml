# DUMMY value for the local demo only. Real environments create the secret out of band:
#   kubectl -n final-app create secret generic final-app-secret --from-literal=API_TOKEN=<real token>
apiVersion: v1
kind: Secret
metadata:
  name: final-app-secret
  namespace: final-app
  labels: {app: final-app}
type: Opaque
stringData:
  API_TOKEN: "dummy-token-change-me"
