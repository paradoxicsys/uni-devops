apiVersion: v1
kind: Pod
metadata:
  name: {{ include "final-app.fullname" . }}-test
  labels: {{- include "final-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c", "wget -qO- http://{{ include "final-app.fullname" . }}:{{ .Values.service.port }}/ready"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      resources:
        limits: {cpu: 50m, memory: 32Mi}
