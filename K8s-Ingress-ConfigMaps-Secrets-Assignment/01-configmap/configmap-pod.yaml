# Pod that consumes the ConfigMap "yatri-app-config" (app-config.yaml) in three ways:
#   1. envFrom        -> every key becomes an environment variable
#   2. env.valueFrom  -> one key exposed under a different variable name
#   3. volume mount   -> every key becomes a file under /etc/config
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
  labels:
    app: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Starting in $ENVIRONMENT mode, log level $APP_LOG_LEVEL, port $PORT\"; sleep 3600"]
      envFrom:
        - configMapRef:
            name: yatri-app-config
      env:
        - name: APP_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: LOG_LEVEL
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: config-volume
      configMap:
        name: yatri-app-config
