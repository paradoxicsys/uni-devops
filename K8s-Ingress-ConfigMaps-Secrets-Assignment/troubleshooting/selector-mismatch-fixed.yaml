# ==============================================================================
# FIXED VERSION OF selector-mismatch.yaml
# Demonstrates API server validation error when selector labels do not match pod template labels
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-error-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: correct-app-name
  template:
    metadata:
      labels:
        # FIXED: template label now matches selector.matchLabels
        app: correct-app-name
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
