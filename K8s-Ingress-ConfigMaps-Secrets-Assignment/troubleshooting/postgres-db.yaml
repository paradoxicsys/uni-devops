# PostgreSQL server whose real password is "mypassword" (dummy demo value).
apiVersion: v1
kind: Secret
metadata:
  name: pg-server-secret
type: Opaque
data:
  POSTGRES_PASSWORD: bXlwYXNzd29yZA==      # echo -n "mypassword" | base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: yatri_admin}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pg-server-secret, key: POSTGRES_PASSWORD}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "yatri_admin"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
