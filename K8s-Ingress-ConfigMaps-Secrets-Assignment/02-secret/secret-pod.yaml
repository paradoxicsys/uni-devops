# Pod that consumes the Secret "yatri-db-secret" (db-secret.yaml, dummy demo values):
#   1. env.valueFrom.secretKeyRef -> individual keys as environment variables
#   2. secret volume              -> every key as a read-only file under /etc/db-secret
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Connecting to $POSTGRES_DB as $POSTGRES_USER\"; sleep 3600"]
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_DB
      volumeMounts:
        - name: db-secret-volume
          mountPath: /etc/db-secret
          readOnly: true
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: db-secret-volume
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400
