apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          import time
          # FIX 1 (code): allocate a bounded working set (50MB) instead of 1000MB
          print("Allocating 50MB working set...", flush=True)
          chunks = [b"x" * (10 * 1024 * 1024) for _ in range(5)]
          print("Allocated", len(chunks) * 10, "MB - running", flush=True)
          while True:
              time.sleep(3600)
      resources:
        # FIX 2 (config): give the container a limit that covers its real usage
        requests:
          memory: "96Mi"
        limits:
          memory: "128Mi"
