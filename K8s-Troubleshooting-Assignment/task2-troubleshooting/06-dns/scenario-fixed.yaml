apiVersion: v1
kind: Pod
metadata:
  name: fail-4-dns-failure-pod
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "Attempting connection to internal service...";
          # FIX: use a Service that exists, in the namespace where it exists:
          #      <service>.<namespace>.svc.cluster.local
          curl -sS --connect-timeout 3 -o /dev/null -w "HTTP %{http_code} from web-service\n" http://web-service.default.svc.cluster.local:80 || true
          echo "Process sleeping...";
          sleep 3600
