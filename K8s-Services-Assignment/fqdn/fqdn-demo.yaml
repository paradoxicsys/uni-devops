# Two namespaces, each with a "backend" Deployment + ClusterIP Service of the SAME name,
# plus a DNS client pod in "dev" to test short names vs cross-namespace names vs FQDN.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["sh", "-c", "echo 'backend in namespace DEV' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["sh", "-c", "echo 'backend in namespace PROD' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: prod
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: dev
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "infinity"]
